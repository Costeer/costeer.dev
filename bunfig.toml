# Bun configuration for costeer.dev
# https://bun.sh/docs/runtime/bunfig

[install]
# Use exact dependency versions in lockfile, but allow ranges in package.json
exact = false
# Save peer dependencies
peer = true

[install.cache]
disable = false

[run]
# Let executable shebangs run with their intended runtime (Astro uses Node).
# Running Astro under Bun can make native Node modules such as `sharp` fail to
# load, which Astro reports as MissingSharp for image optimization requests.
bun = false
silent = false
